[helpdesk_servers]
# Local workstation acting as the managed Docker host target in WSL2
helpdesk-host-01 ansible_host=localhost ansible_connection=local

[local]
localhost ansible_connection=local

[web_servers]
helpdesk-host-01

[database_servers]
helpdesk-host-01

